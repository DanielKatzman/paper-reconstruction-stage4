name: Portable Stage 4 baseline
on: [push, pull_request]
jobs:
  stage4:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./contracts/sdk -e ./stages/stage4 -c ./stages/stage4/constraints.txt
      - run: python -B tools/verify_compatibility.py
      - run: python -B tools/verify_export.py
      - run: python -B tools/test_stage4.py
      - run: python -B -m unittest discover -s tests -v
  cpu-rankers:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.7.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ./contracts/sdk -e ./stages/stage3[test] -c ./stages/stage3/constraints.txt
      - run: python -B tools/verify_compatibility.py
      - run: python -B tools/check_cpu_runtime.py
